services:
  quizbank:
    build:
      context: .
    image: quizbank-local:0.2.0
    user: "${QUIZBANK_UID:-0}:${QUIZBANK_GID:-0}"
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: bind
        source: ${QUIZBANK_BANK_DIR:-.}
        target: /quizbank-bank
        read_only: true
      - type: bind
        source: ${QUIZBANK_OUTPUT_DIR:-.}
        target: /quizbank-output
    environment:
      HOME: /tmp/quizbank-home
      QUIZBANK_EXTERNAL_BANK: "${QUIZBANK_EXTERNAL_BANK:-}"
      QUIZBANK_EXTERNAL_OUTPUT: "${QUIZBANK_EXTERNAL_OUTPUT:-}"
